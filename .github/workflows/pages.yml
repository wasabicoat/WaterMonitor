name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Restore cached data from gh-pages (fallback for geo-restricted upstreams)
        run: |
          git fetch origin gh-pages:gh-pages || true
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            mkdir -p cache
            git checkout gh-pages -- cache/ api/ 2>/dev/null || true
            if [ -d api ]; then
              for f in basin.json thaiwater.json pakkret.json rangsit.json cctv.json; do
                [ -f "api/$f" ] && [ ! -f "cache/$f" ] && cp "api/$f" "cache/$f" || true
              done
            fi
            git checkout HEAD -- api/ 2>/dev/null || true
          fi

      - name: Build static site
        run: python3 scripts/build_pages.py --refresh

      - name: Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy static build to GitHub Pages"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
